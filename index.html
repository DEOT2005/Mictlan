<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa 3D del Mictlán en RA - Gráfica Computacional</title>
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        :root {
            --panel-bg: rgba(15, 23, 42, 0.95);
            --accent: #d97706;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* Panel de Información Lateral */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 350px;
            max-height: 90vh;
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            z-index: 999;
            color: var(--text-main);
            backdrop-filter: blur(8px);
        }
        h1 { font-size: 1.2em; color: var(--accent); margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 8px; }
        h2 { font-size: 1em; color: #fbbf24; margin-bottom: 6px; }
        p { font-size: 0.88em; color: var(--text-sub); line-height: 1.5; }
        .badge {
            display: inline-block;
            background: #78350f;
            color: #fde68a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7em;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Panel Informativo Lateral -->
    <div class="info-panel">
        <span class="badge">GRÁFICA COMPUTACIONAL • RA</span>
        <h1>El Mictlán (Inframundo)</h1>
        <div id="level-description">
            <h2>📜 Instrucciones</h2>
            <p>Apunta la cámara de tu laptop o dispositivo hacia el <strong>Marcador Hiro</strong>. La pirámide 3D aparecerá sobre él. Haz clic o toca los niveles para ver su mitología.</p>
        </div>
    </div>

    <!-- Escena de Realidad Aumentada con AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false">

        <!-- Cámara con cursor interactivo para clics -->
        <a-entity camera>
            <a-cursor raycaster="objects: .clickable" fuse="false" material="color: #f59e0b; shader: flat"></a-cursor>
        </a-entity>

        <!-- Iluminación -->
        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" position="2 4 2" intensity="1.2" color="#fbbf24"></a-light>

        <!-- Marcador Hiro (Aquí se ancla todo el modelo 3D) -->
        <a-marker preset="hiro">

            <!-- Estructura Estática de la Pirámide del Mictlán -->
            <a-entity position="0 0 0" scale="0.6 0.6 0.6">

                <!-- Base -->
                <a-cylinder position="0 -0.2 0" radius="3" height="0.3" color="#0f172a"></a-cylinder>

                <!-- Nivel 1: Apanoayan -->
                <a-box class="clickable" position="0 0.2 0" width="4.5" height="0.4" depth="4.5" color="#1e3a8a"
                       onclick="updateInfo('Nivel 1: Apanoayan (Lugar de los Perros)', 'El río Apanohuayan. Las almas cruzaban con ayuda de un perro xoloitzcuintle que te reconocía si en vida fuiste bueno con ellos.')">
                </a-box>

                <!-- Nivel 2: Tepeme Monamictia -->
                <a-box class="clickable" position="0 0.7 0" width="3.9" height="0.4" depth="3.9" color="#7f1d1d"
                       onclick="updateInfo('Nivel 2: Tepeme Monamictia (Cerros que Chocan)', 'Dos sierras gigantescas que chocaban entre sí constantemente. Las almas debían cruzarlas en el momento exacto.')">
                </a-box>

                <!-- Nivel 3: Itztlan -->
                <a-box class="clickable" position="0 1.2 0" width="3.3" height="0.4" depth="3.3" color="#334155"
                       onclick="updateInfo('Nivel 3: Itztlan (Lugar de la Obsidiana)', 'Camino empinado de pedernales afilados y cuchillos de obsidiana donde el viento cortaba como navajas.')">
                </a-box>

                <!-- Nivel 4: Itzeccayan -->
                <a-box class="clickable" position="0 1.7 0" width="2.7" height="0.4" depth="2.7" color="#0284c7"
                       onclick="updateInfo('Nivel 4: Itzeccayan (Viento de Obsidiana)', 'Zona de frío extremo con un viento helado capaz de arrancar extremidades y rocas afiladas.')">
                </a-box>

                <!-- Nivel 5: Panetecoyan -->
                <a-box class="clickable" position="0 2.2 0" width="2.1" height="0.4" depth="2.1" color="#78350f"
                       onclick="updateInfo('Nivel 5: Panetecoyan (Lugar donde las banderas flotan)', 'Sitio desolado donde la gravedad fallaba y las almas flotaban a merced del viento como banderas.')">
                </a-box>

                <!-- Nivel 6: Timiminaloyan -->
                <a-box class="clickable" position="0 2.7 0" width="1.6" height="0.4" depth="1.6" color="#b45309"
                       onclick="updateInfo('Nivel 6: Timiminaloyan (Lugar donde flechan almas)', 'Sendero invisible donde manos ocultas disparaban flechas perdidas que atravesaban a los difuntos.')">
                </a-box>

                <!-- Nivel 7: Teocoyohualoyan -->
                <a-box class="clickable" position="0 3.2 0" width="1.1" height="0.4" depth="1.1" color="#14532d"
                       onclick="updateInfo('Nivel 7: Teocoyohualoyan (Devoran corazones)', 'Morada de jaguares salvajes que acechaban para saltar y arrancar el corazón de los caminantes.')">
                </a-box>

                <!-- Nivel 8: Izmictlan Acaltepetla -->
                <a-box class="clickable" position="0 3.7 0" width="0.7" height="0.4" depth="0.7" color="#581c87"
                       onclick="updateInfo('Nivel 8: Izmictlan Acaltepetla (Aguas Negras)', 'Lago de aguas oscuras donde habitaba la serpiente Xochitonal y monstruos de las profundidades.')">
                </a-box>

                <!-- Nivel 9: Chicunamictlan -->
                <a-cylinder class="clickable" position="0 4.3 0" radius="0.4" height="0.8" color="#f59e0b"
                            onclick="updateInfo('Nivel 9: Chicunamictlan (Descanso Eterno)', 'Fin del viaje. Las almas encontraban a Mictlantecuhtli y obtenían el descanso absoluto en el cosmos.')">
                </a-cylinder>

            </a-entity>

        </a-marker>

    </a-scene>

    <!-- Script para actualizar la descripción en pantalla -->
    <script>
        function updateInfo(title, description) {
            const panel = document.getElementById('level-description');
            panel.innerHTML = `<h2>${title}</h2><p>${description}</p>`;
        }
    </script>

</body>
</html>
